<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Airplanes Around the World: see where famous airplanes fly</title>
    <meta name="description" content="Fly through sunset clouds, spin a photo-real Earth with 12 famous routes, and meet six airplanes in a 3D hangar, from the 53-second island hop to the 18-hour marathon." />
    <meta name="theme-color" content="#0B1426" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Airplanes Around the World" />
    <meta property="og:description" content="Every airplane has a story. See where they fly." />
    <meta property="og:image" content="og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- Boot script (Lead): sets html data attributes before first paint so nothing jumps.
         Mirrors src/lib/boot.ts; keep it tiny and dependency-free. -->
    <script>
      (function () {
        var d = document.documentElement, q = location.search, vis = null, lite = null;
        try { vis = localStorage.getItem('aatw:visited'); } catch (e) {}
        try { lite = sessionStorage.getItem('aatw:lite'); } catch (e) {}
        var reduced = /[?&]motion=reduced/.test(q);
        try { reduced = reduced || matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        var noLite = /[?&]lite=0/.test(q);
        var useLite = /[?&]lite=1/.test(q) || (lite === '1' && !noLite) || !('WebGL2RenderingContext' in window);
        var loader = /[?&]loader=1/.test(q) ? 'show' : /[?&]loader=0/.test(q) ? 'skip' : vis ? 'skip' : 'show';
        d.dataset.mode = 'boot';
        d.dataset.motion = reduced ? 'reduced' : 'full';
        d.dataset.layout = reduced || useLite ? 'compact' : 'cinematic';
        d.dataset.loader = loader;
        if (useLite) d.dataset.lite = '1';
      })();
    </script>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
