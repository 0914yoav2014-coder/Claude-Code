<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vertex</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; }
  .ion { fill:var(--ion); }
  .soft { fill:var(--ion-soft); }
  .deep { fill:var(--inverse); }
  .flux { fill:var(--flux); }
  .cut { fill:var(--canvas); }
  .blk { rx:var(--radius-md); }
  .sq { rx:var(--radius-xs); }
  .words { position:absolute; left:var(--space-7); bottom:var(--space-7); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.92; font-weight:700; letter-spacing:-.045em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ion 192x232 (space-9*2 wide) bled off the top; inverse 160x240 bled off right and bottom; ion-soft 88x120 bled off bottom; flux 48x48 (space-7) as the one hot spot
  arrangement one tall slab with satellites, staggered down-right like a deploy fanning out to regions
  pattern     dot grid at a space-7/1.5 (32px) pitch cut out of the ion slab: "precise, technical, mono, a 4px grid" is how the README describes Vertex
  scales      space-4, space-5, space-7, space-9; radius-md on blocks, radius-xs on flux
-->
<rect class="soft blk" x="16" y="168" width="88" height="136"/>
<rect class="ion blk" x="120" y="-16" width="192" height="232"/>
<circle class="cut" cx="144" cy="16" r="2"/><circle class="cut" cx="144" cy="48" r="2"/><circle class="cut" cx="144" cy="80" r="2"/><circle class="cut" cx="144" cy="112" r="2"/><circle class="cut" cx="144" cy="144" r="2"/><circle class="cut" cx="144" cy="176" r="2"/><circle class="cut" cx="144" cy="208" r="2"/><circle class="cut" cx="176" cy="16" r="2"/><circle class="cut" cx="176" cy="48" r="2"/><circle class="cut" cx="176" cy="80" r="2"/><circle class="cut" cx="176" cy="112" r="2"/><circle class="cut" cx="176" cy="144" r="2"/><circle class="cut" cx="176" cy="176" r="2"/><circle class="cut" cx="176" cy="208" r="2"/><circle class="cut" cx="208" cy="16" r="2"/><circle class="cut" cx="208" cy="48" r="2"/><circle class="cut" cx="208" cy="80" r="2"/><circle class="cut" cx="208" cy="112" r="2"/><circle class="cut" cx="208" cy="144" r="2"/><circle class="cut" cx="208" cy="176" r="2"/><circle class="cut" cx="208" cy="208" r="2"/><circle class="cut" cx="240" cy="16" r="2"/><circle class="cut" cx="240" cy="48" r="2"/><circle class="cut" cx="240" cy="80" r="2"/><circle class="cut" cx="240" cy="112" r="2"/><circle class="cut" cx="240" cy="144" r="2"/><circle class="cut" cx="240" cy="176" r="2"/><circle class="cut" cx="240" cy="208" r="2"/><circle class="cut" cx="272" cy="16" r="2"/><circle class="cut" cx="272" cy="48" r="2"/><circle class="cut" cx="272" cy="80" r="2"/><circle class="cut" cx="272" cy="112" r="2"/><circle class="cut" cx="272" cy="144" r="2"/><circle class="cut" cx="272" cy="176" r="2"/><circle class="cut" cx="272" cy="208" r="2"/><circle class="cut" cx="304" cy="16" r="2"/><circle class="cut" cx="304" cy="48" r="2"/><circle class="cut" cx="304" cy="80" r="2"/><circle class="cut" cx="304" cy="112" r="2"/><circle class="cut" cx="304" cy="144" r="2"/><circle class="cut" cx="304" cy="176" r="2"/><circle class="cut" cx="304" cy="208" r="2"/>
<rect class="deep blk" x="328" y="64" width="168" height="240"/>
<rect class="flux sq" x="264" y="232" width="48" height="48"/>
</svg>
</div>
<div class="words">
<h1 class="name">Vertex</h1>
<p class="tag">A design system for developer tools and modern product sites.</p>
</div>
</div>
</body>
</html>
