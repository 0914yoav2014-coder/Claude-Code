<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="vx-stack">
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center">
    <a class="vx-btn vx-btn--primary vx-btn--lg" href="#">Start deploying <span class="vx-btn__arrow" aria-hidden="true">→</span></a>
    <a class="vx-btn vx-btn--lg" href="#">Talk to sales</a>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center">
    <button class="vx-btn vx-btn--primary" type="button">Create project</button>
    <button class="vx-btn vx-btn--inverse" type="button">Open dashboard</button>
    <button class="vx-btn" type="button">Search docs <span class="vx-kbd">⌘K</span></button>
    <button class="vx-btn vx-btn--ghost" type="button">Cancel</button>
    <button class="vx-btn vx-btn--danger vx-btn--sm" type="button">Delete key</button>
    <button class="vx-btn vx-btn--primary vx-btn--sm" type="button" disabled>Deploying…</button>
  </div>
</div>
</body>
</html>
