<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tabs — preview</title></head>
<body>
<div class="vx-preview">
  <div class="vx-tabs" role="tablist" aria-label="Billing period">
    <button class="vx-tab" role="tab" aria-selected="true" type="button">Monthly</button>
    <button class="vx-tab" role="tab" aria-selected="false" type="button">Yearly <span class="vx-badge vx-badge--new" style="height:18px;margin-left:4px">−20%</span></button>
  </div>
  <div class="vx-tabs" role="tablist" aria-label="Package manager">
    <button class="vx-tab" role="tab" aria-selected="false" type="button">npm</button>
    <button class="vx-tab" role="tab" aria-selected="true" type="button">pnpm</button>
    <button class="vx-tab" role="tab" aria-selected="false" type="button">bun</button>
  </div>
</div>
</body>
</html>
